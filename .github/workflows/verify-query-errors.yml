name: Verify Query Error Handling

# 取得失敗が「データなし」に化ける書き方の持ち込みを、PR時に機械的に止める（BOA-359）。
# 既存の verify-cache-config.yml と同じ形（パス限定・単一スクリプト）。
on:
  pull_request:
    paths:
      - 'src/**/*.js'
      - 'src/**/*.jsx'
      - 'scripts/maintenance/verify-query-errors.js'
      - '.github/workflows/verify-query-errors.yml'

jobs:
  verify-query-errors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify query error handling
        run: node scripts/maintenance/verify-query-errors.js
