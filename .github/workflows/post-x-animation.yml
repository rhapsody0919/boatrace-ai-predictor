name: Post X Animation

# 2026-08-14: AIモデル大規模改修（PR#286）で1マーク展開アニメーション
# （FirstMarkAnimation）とモデル切替UI自体を撤去したため、本ワークフローが
# 録画対象とするDOM要素が本番に存在しなくなり毎日必ず失敗する状態だった。
# スクリプト自体（scripts/daily/post-x-animation.js）は将来アニメーションを
# 再設計する際の参考用に残し、定期実行のみ無効化する
on:
  # schedule:
  #   - cron: "0 1 * * *" # JST 10:00（UTC 01:00）— 無効化中（上記コメント参照）
  workflow_dispatch: # 手動実行のみ

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Record animation
        run: node scripts/daily/post-x-animation.js

      - name: Upload animation as artifact
        uses: actions/upload-artifact@v4
        with:
          name: x-animation
          path: animation-output/
          retention-days: 3
