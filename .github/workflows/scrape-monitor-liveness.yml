name: Scrape Monitor Liveness

# データ取得の監視（Vercel Cron の api/cron/scrape-monitor）自体が動いているかを、監視の外から確認する
# （メタ監視。docs/design/scraping-vercel-consolidation/plan.md §6 の2次）。
# 取得ではなく監視のため、ADR-0066（取得系のVercel一本化）の対象外で、GitHub Actionsのまま。
# GitHubのscheduleは数時間遅れるが、監視の死活は1日単位で足りる（要判断(j)）。
# 予定表のテーブルが未適用（マイグレーション072）の間は、確認をスキップする。

on:
  schedule:
    # JST 09:30 = UTC 00:30（遅れて起動しても、運用窓 JST 07:10〜23:59 の中に収まる想定）
    - cron: '30 0 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-monitor-liveness
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: 監視の死活確認
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set +e
          OUTPUT=$(node scripts/maintenance/check-scrape-monitor-liveness.js)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "summary<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (異常時のみ)
        if: steps.check.outputs.exit_code != '0'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg summary "$SUMMARY" '{
              attachments: [{
                color: "#c9a227",
                blocks: [{
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ("*データ取得の監視が動いていない可能性があります*\n```" + $summary + "```\n通知は Vercel の api/cron/scrape-monitor（5分ごと）が出しています。これが止まると、expired・未実行・死活の通知が届きません（docs/design/scraping-vercel-consolidation/plan.md §6・§7）")
                  }
                }]
              }]
            }')"

      - name: 確認の失敗を、ジョブの失敗として残す
        if: steps.check.outputs.exit_code != '0'
        run: exit 1
