name: Generate Morning Digest

# 「本日のデータ一覧」（BOA-402）の1日ぶんの抽出結果を
# morning_digest_rows / morning_digest_days に書き込む。
# ページ（/today）もSNS下書き生成もこの2表だけを読む（ADR-0070）。
#
# 実行基盤がVercelではなくGitHub Actionsなのは、ADR-0066が
# 「取得済みデータのDB内集計・統計更新」を対象外としているため。
# 外部サイトへの通信は一切しない。
#
# ## 実行時刻（JST 05:30 と 06:30）
#
# 当日の race_entries と predictions の投入時刻の実測（JST）:
#   09-20 01:06 / 09-21 01:57 / 09-22 00:58 / 09-23 00:05 / 09-24 05:01〜05:09
# 最も遅かった実測が 05:09 のため 05:30 を1回目とし、さらに遅れた日のために
# 06:30 の2回目を置く。
#
# ⚠️ この根拠は n=1 である（race_entries.created_at は 2026-09-20 より前が全件NULL、
# predictions は predicted_at が日中の再生成で上書きされるため、事後に「最初に
# 投入された時刻」を測れるのは 2026-09-24 の1日だけ）。ADR-0066 が morning-init の
# Vercel移行を予定しているため投入時刻は今後変わる。2回目の実行と、
# predictions を必須条件にしない設計（plan.md §3.2）で、ずれても壊れないようにしてある。
#
# ## 夜間バッチとの順序
#
# aggregate-racer-course-technique-stats.yml（JST 01:10）が先に走る必要がある。
# このジョブの完全性チェックが racer_course_technique_stats.window_end を見て、
# 前日より古ければ書き込まずに終了する。
#
# ## race_entries を書く側（Vercel の races-init）との関係
#
# races-init（vercel.json の `*/2 20-23,0-14`）は JST 05:00 に始まり、24会場でも
# 約15分で終わる（api/cron/races-init.js のヘッダー）。1回目の 05:30 はこの直後。
# ただし races-init が全滅した日は、GitHub側のフェイルセーフが **JST 07:00** に
# なってから初期化する（scripts/lib/racesInit/ghaSkip.js の FALLBACK_FROM_JST_HOUR）。
# 06:30 が最終試行だとこの日は永久に未生成のまま失敗通知だけが出るので、
# フェイルセーフの完了を待つ 3回目（08:00）を置き、検証はそこで行う。
#
# ## 失敗の扱い
#
# 完全性チェックを満たさない場合、スクリプトは**書き込まずに終了コード0で終わる**
# （次回の実行で再試行させるため）。最終回（08:00）でも満たせない場合に
# ジョブを失敗させたいので、最終回のステップだけ「書けたかどうか」を検証する。
# continue-on-error は付けない。
# ⚠️ 定時実行は Vercel Cron（api/cron/morning-digest.js、vercel.json）へ移した（ADR-0066 §改訂1）。
# GitHub Actions の定時実行は実測で2.5〜4.5時間遅れるのが常態で、朝に出ることが価値の中心の
# このページでは前提が成立しなかった（plan.md §2.4）。ここに schedule を復活させないこと。
# このワークフローは、障害時の手動復旧・任意日のバックフィル用に残している。
on:
  workflow_dispatch:
    inputs:
      date:
        description: "対象日（YYYY-MM-DD、JST）。空なら当日"
        required: false
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - name: Generate digest
        run: |
          if [ -n "${{ inputs.date }}" ]; then
            node scripts/daily/generate-morning-digest.js --date="${{ inputs.date }}"
          else
            node scripts/daily/generate-morning-digest.js
          fi
        env:
          TZ: "Asia/Tokyo"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # 生成後に、当日ぶんが実際に書けたかを検証する（手動実行なので毎回走らせる）。
      #
      # 定時実行の「黙って未生成のまま」の検知は、Vercel 側の監視が担う。
      # api/cron/scrape-monitor.js が scrape_job_state を見て、日次ジョブが
      # targetTimeJst から3時間以上たっても当日の対象日を処理していなければ
      # daily_overdue として SLACK_WEBHOOK_URL へ通知する
      # （scripts/lib/scrapeJobs/monitor.js の evaluateJobStates）。
      # morning_digest は targetTimeJst=05:30 なので JST 08:30 以降に鳴る。
      - name: Verify the digest exists
        id: verify
        run: node scripts/maintenance/verify-morning-digest.js
        env:
          TZ: "Asia/Tokyo"
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
