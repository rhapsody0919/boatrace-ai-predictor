name: Aggregate Racer Stats

# 起動は cron-job.org からの workflow_dispatch（毎日 23:00 JST、時刻どおり）だけにする。
# 以前は GitHub の schedule（同じ 23:00 指定）も残っていて、3〜4時間遅れて同じ集計を
# もう一度走らせていた（1日2回、BOA-600。docs/design/scraping-vercel-consolidation/job-inventory.md）。
# cron-job.org 側を止めるときは、ここに schedule を戻す
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Aggregate all racer stats
        run: node scripts/analysis/aggregate-racer-stats.js --all
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Update venue stats (90-day rolling)
        run: node scripts/maintenance/update-venue-stats.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # 会場×グレード×艇番の横断統計（venue_grade_boat_stats、BOA-263）。2026-02-04 以降の全レース（約3.7万件）を
      # 読み、532セルのうち値の変わったものだけを書く（2026-10-02 の実測で約20秒）。定期実行が無く 9/15 から
      # 止まっていた（BOA-694）。選手の集計と同じく、その日の結果が出そろった後の 23:00 JST に回す
      - name: Update venue x grade x boat stats
        run: node scripts/daily/calculate-venue-grade-stats.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
