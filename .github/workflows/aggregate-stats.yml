name: Aggregate Racer Stats

# 起動は cron-job.org からの workflow_dispatch（毎日 23:00 JST、時刻どおり）だけにする。
# 以前は GitHub の schedule（同じ 23:00 指定）も残っていて、3〜4時間遅れて同じ集計を
# もう一度走らせていた（1日2回、BOA-600。docs/design/scraping-vercel-consolidation/job-inventory.md）。
# cron-job.org 側を止めるときは、ここに schedule を戻す
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Aggregate all racer stats
        run: node scripts/analysis/aggregate-racer-stats.js --all
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Update venue stats (90-day rolling)
        run: node scripts/maintenance/update-venue-stats.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
