name: E2E Smoke Test

# PRゲート。本番へは繋がず、e2e/recordings/ の録画（HAR）を再生し、ブラウザ時計を
# 録画時刻に固定して実行する（BOA-466、ADR-0077）。以前は本番Supabase・本番 /api に
# 直結しており、当日データと実行時刻で結果が変わっていた（直近30回で失敗14回）。
# 本番データでの実行は e2e-live.yml が開催時間帯に定期実行する。
# 録画の撮り直し: npm run test:e2e:record

on:
  pull_request:
    branches:
      - master

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Supabase のオリジンは録画（e2e/recordings/meta.json）から playwright.config.js が
      # 設定し、録画に無い通信は abort するため、本番の接続情報は渡さない
      - name: Run E2E smoke tests (録画の再生)
        env:
          CI: true
        run: npm run test:e2e

      # skipされたテストを数える。データ依存の test.skip() が常に真になると
      # そのテストは無言で無効化され、緑のまま何も検証しない状態が続く。
      # 実際に320px横スクロールのテスト7個が長期間skipされていた（3b6ef2ce）。
      # テストが落ちても skip の状況は見たいので always() で動かす。
      - name: Check skipped tests
        if: always()
        run: node scripts/maintenance/check-e2e-skips.js

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
