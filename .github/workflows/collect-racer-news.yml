name: Collect Racer News

on:
  schedule:
    - cron: '10 14 * * *' # JST 23:10（calculate-accuracy.ymlの23:30より前）
  workflow_dispatch:

concurrency:
  group: collect-racer-news
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # SKIP_RACER_NEWS_ON_GHA=true の間は、Vercel が健全な場合に限り、この取得を行わない（フェイルセーフ付きSKIP）。
  # 変数が未設定・true 以外なら、この gate ジョブは起動せず（DB も読まない）、従来どおり取得ジョブが実行される。
  # true のときは、scrape_job_state の racer_news（と取得先のブレーカー）を読み、Vercel が live で
  # 対象日を処理済みのときだけスキップする。live でない・処理が済んでいない・状態を読めない（gate ジョブの失敗を含む）
  # ときは、実行する（自動フェイルオーバー）。判定の定義: scripts/lib/ghaSkipGate.js、
  # docs/design/scraping-vercel-consolidation/verification-runbook.md P。--wait は、指定時刻の直後に Vercel の完了を最大10分待つ
  gate:
    if: ${{ vars.SKIP_RACER_NEWS_ON_GHA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether Vercel handles this job
        id: gate
        continue-on-error: true
        run: node scripts/maintenance/gha-skip-gate.js SKIP_RACER_NEWS_ON_GHA --wait
        env:
          SKIP_RACER_NEWS_ON_GHA: ${{ vars.SKIP_RACER_NEWS_ON_GHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  collect:
    # 未設定・true 以外: gate は skipped（outputs は空）→ 従来どおり実行。true: gate の判定がスキップなら実行しない。
    # !cancelled() は、gate が skipped・失敗のときも、この取得ジョブを実行するため（フェイルセーフ）
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # アプリ ryujin-bot の Secrets は environment ryujin-bot（Deployment branches: master だけ）に置く。
    # 別ブランチの workflow_dispatch や、別ブランチに足したワークフローから bypass 用のトークンを作らせないため
    environment: ryujin-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Collect racer news
        run: node scripts/daily/collect-racer-news.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # master への push はアプリ ryujin-bot の名義で行う（master の ruleset の bypass に GITHUB_TOKEN は入れられないため）。
      # トークンの有効期限は1時間なので、checkout ではなく push の直前に作る
      - name: Create ryujin-bot token
        id: app-token
        if: github.ref == 'refs/heads/master'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RYUJIN_BOT_APP_ID }}
          private-key: ${{ secrets.RYUJIN_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit pending-review updates if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/analysis/racer-news-pending-review/pending.json
          git diff --staged --quiet || git commit -m "chore: 選手ニュース要確認リストを更新 [automated]"
          # masterの更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
