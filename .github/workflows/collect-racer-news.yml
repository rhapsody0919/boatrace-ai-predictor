name: Collect Racer News

on:
  schedule:
    - cron: '10 14 * * *' # JST 23:10（calculate-accuracy.ymlの23:30より前）
  workflow_dispatch:

concurrency:
  group: collect-racer-news
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  collect:
    # リポジトリ変数 SKIP_RACER_NEWS_ON_GHA=true の間は、この取得を行わない（Vercel Cron の racer_news（api/cron/racer-news.js） へ移した後の、
    # GitHub側の停止。コードは削除しない。未設定・"true"以外なら従来どおり実行する。切り戻しは変数を消す（false）だけ。
    # 手順: docs/design/scraping-vercel-consolidation/verification-runbook.md L）
    if: ${{ vars.SKIP_RACER_NEWS_ON_GHA != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Collect racer news
        run: node scripts/daily/collect-racer-news.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Commit pending-review updates if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/analysis/racer-news-pending-review/pending.json
          git diff --staged --quiet || git commit -m "chore: 選手ニュース要確認リストを更新 [automated]"
          # masterの更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh
