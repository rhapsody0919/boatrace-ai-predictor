name: E2E Re-record (録画の自動撮り直し)

# PRゲートの E2E が再生する録画を、毎日 master で撮り直す（BOA-466、ADR-0077）。
#
# 背景: データ取得部分（supabaseDataService.js）を変える PR が1日に何本も入る。PR ごとに
# 人手で撮り直す前提は成り立たず、撮り直さないと録画に無い通信が増えていく（PRゲートは
# 素通しして一覧に出すが、素通しが多いほど本番依存に戻る）。
#
# 手順:
#   1. 本番に繋いで全件を録画する（E2E_RECORD=1）
#   2. 撮った録画だけで再生して全件実行する（E2E_REPLAY_STRICT=1: 録画に無い通信は abort）
#   3. 採用条件を満たすときだけ採用する
#      - 2 が全件通る
#      - skip が現行の録画より増えていない（発走前のレースが少ない日に撮ると skip が増える）
#   4. 採用したら GitHub Release に zip で添付し、ポインタ（e2e/recording.json）を master に
#      直接 push する（push-with-retry.sh。regenerate-generated-docs.yml と同じ流儀）。
#      GITHUB_TOKEN の push は他のワークフローを起動しない
#   5. 古い録画 Release を消す（直近14件を残す）
#   採用しなかった・失敗したときは Slack に通知する（定期実行は1日1回まで。下記）
#
# 起動は1日4回（JST 10:23 / 12:47 / 14:37 / 16:13）。毎時0分は負荷が集中するため避ける
# （公式: "High load times include the start of every hour" /
# "schedule your workflow to run at a different time of the hour"）。
# GitHub の schedule は数時間遅れ、取りこぼされることもある。2026-09-30 は JST11:00 の
# 予定が 17:15 に、2026-10-01 は JST10:23 の予定が 16:15・12:47 の予定が 19:27 に起動した
# （このリポジトリの他の定期実行も1〜6時間の遅れが常態）。起動を4回に増やし、1回が
# 不採用・遅延でも同じ日のうちに撮り直せるようにする。
# その日（JST）の録画を採用済みなら、後の起動は何もせず終わる（二重に撮らない）。
# 遅れて JST19時以降に起動したときも撮らない（発走前のレースが夜間開催の数場だけになる）。
# 判定は scripts/maintenance/e2e-recording.js gate。workflow_dispatch は判定せずに撮る。
# 同時に2本は走らない（concurrency）。後の起動は前の起動の終了を待ってから master を
# checkout するので、前の起動が push したポインタで「採用済み」を判定できる。
#
# Slack 通知: 定期実行の「採用しなかった・撮らなかった」は、同じ日（JST）に別の定期実行が
# 通知済みなら出さない（e2e-recording.js notify-dedupe）。4回とも不採用でも通知は1回で、
# 2回目以降の結果は各実行の step summary に残る。ワークフロー自体の失敗（ステップの失敗）と
# workflow_dispatch は毎回通知する。
# 必要な権限: contents: write（Release の作成・削除とポインタの push）、
# actions: read（その日の他の実行が通知済みかを見る）。
# 使う Secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY（本番の読み取りのみ）、SLACK_WEBHOOK_URL

on:
  schedule:
    # 採用済みなら後の起動は何もしない。時刻は JST10〜17時に散らし、0分を避ける
    - cron: '23 1 * * *' # JST 10:23
    - cron: '47 3 * * *' # JST 12:47
    - cron: '37 5 * * *' # JST 14:37
    - cron: '13 7 * * *' # JST 16:13
  workflow_dispatch:

# 起動が遅れて重なっても、同時には走らせない（後の起動は前の起動の終了を待ち、
# checkout した master のポインタで「採用済み」を判定する）
concurrency:
  group: e2e-rerecord
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  rerecord:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # checkout の後に判定する。本命が採用して push したポインタを、予備はここで読む
      - name: 撮り直すか（定期実行のみ）
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESULT=$(node scripts/maintenance/e2e-recording.js gate)
          echo "$RESULT"
          {
            echo "run=$(echo "$RESULT" | jq -r '.run')"
            # 採用済みで空振りしたときは通知しない。遅れて撮れなかったときは通知する
            echo "notify=$(echo "$RESULT" | jq -r '.notify')"
            echo "result=$RESULT"
          } >> "$GITHUB_OUTPUT"
          REASON=$(echo "$RESULT" | jq -r '.reasons | join("; ")')
          if [ -n "$REASON" ]; then
            echo "## E2E 録画の撮り直し: 撮らずに終了（$REASON）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'

      - name: 録画（本番に繋いで全件）
        id: record
        if: steps.gate.outputs.run == 'true'
        env:
          CI: true
          E2E_RECORD: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          npx playwright test > record.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -40 record.log
          # 録画中のテストの成否は採用条件にしない（本番データでは落ちるテストがありうる）。
          # 採用は次の「撮った録画だけでの再生」で判定する。録画そのものができていなければ落とす
          test -f e2e/recordings/api.har

      - name: 撮った録画だけで再生（録画に無い通信は abort）
        id: replay
        if: steps.gate.outputs.run == 'true'
        env:
          CI: true
          E2E_RECORDING_SOURCE: local
          E2E_REPLAY_STRICT: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          # 録画の実行が書いたレポートを採点しないよう、再生の前に消す
          mv e2e-results.json record-results.json 2>/dev/null
          npx playwright test > replay.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -40 replay.log
          exit 0

      - name: 採用判定
        id: judge
        if: steps.gate.outputs.run == 'true'
        run: |
          set +e
          if [ ! -f e2e-results.json ]; then
            RESULT='{"adopt":false,"reasons":["再生のレポート（e2e-results.json）が無い。再生が途中で止まった"]}'
          else
            RESULT=$(node scripts/maintenance/e2e-recording.js judge e2e-results.json)
          fi
          CODE=$?
          if ! echo "$RESULT" | jq -e '.adopt == true' >/dev/null; then CODE=3; fi
          echo "$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 0 ]; then echo "adopt=true" >> "$GITHUB_OUTPUT"; else echo "adopt=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## E2E 録画の撮り直し"
            echo '```json'
            echo "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Release に添付してポインタを更新
        if: steps.judge.outputs.adopt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.judge.outputs.result }}
        run: |
          SKIPPED=$(echo "$RESULT" | jq '.counts.skipped')
          TESTS=$(echo "$RESULT" | jq '.counts.tests')
          node scripts/maintenance/e2e-recording.js publish --skipped="$SKIPPED" --tests="$TESTS"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add e2e/recording.json
          git commit -m "chore: E2Eの録画を撮り直した [automated]"
          # master の更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh

      - name: 古い録画 Release を消す（直近14件を残す）
        if: steps.judge.outputs.adopt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/e2e-recording.js prune --keep=14

      # 再生で落ちたテストの trace・error-context も残す。どの通信が録画に無くて
      # abort されたかは trace でしか分からない（2026-09-30 は残しておらず特定できなかった）。
      # test-results は再生の実行が作り直すので、ここにあるのは再生の失敗分だけ
      - name: Upload logs
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-logs
          path: |
            record.log
            replay.log
            record-results.json
            e2e-results.json
            test-results/**/trace.zip
            test-results/**/error-context.md
          retention-days: 7

      - name: Notify Slack (採用しなかった・失敗したとき)
        if: >-
          always() && (failure() || steps.gate.outputs.notify == 'true' ||
          (steps.gate.outputs.run == 'true' && steps.judge.outputs.adopt != 'true'))
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ steps.judge.outputs.result || steps.gate.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          # failure() は if: の中でしか使えない（env に書くとワークフロー全体が無効になる）。
          # env では job.status で同じ判定をする
          JOB_FAILED: ${{ job.status == 'failure' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL が未設定のため通知できません"
            exit 0
          fi
          # 定期実行の「採用しなかった・撮らなかった」は1日1回だけ通知する（同じ日に別の
          # 定期実行が通知済みなら出さない）。ワークフロー自体の失敗（push の失敗等）は
          # 理由が別なので必ず通知する。checkout 前に落ちてスクリプトが無いときも通知する
          if [ "$EVENT_NAME" = "schedule" ] && [ "$JOB_FAILED" != "true" ]; then
            DEDUPE=$(node scripts/maintenance/e2e-recording.js notify-dedupe 2>/dev/null || echo '{"notify":true}')
            echo "$DEDUPE"
            if [ "$(printf '%s' "$DEDUPE" | jq -r '.notify')" = "false" ]; then
              echo "## Slack 通知を省略（$(printf '%s' "$DEDUPE" | jq -r '.reasons | join("; ")')）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          REASONS=$(printf '%s' "$RESULT" | jq -r '.reasons // [] | join("\n")' 2>/dev/null)
          if [ -z "$REASONS" ]; then REASONS="ワークフローが途中で失敗した（採用判定の前後）"; fi
          PAYLOAD=$(jq -n --arg reasons "$REASONS" --arg url "$RUN_URL" '{
            attachments: [{
              color: "#e67e22",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: (":warning: *E2Eの録画を撮り直せませんでした（現行の録画のまま）*\n```" + $reasons + "```\nPRゲートは現行の録画で動き続けます。録画に無い通信は本番へ素通しされ、PRコメントに一覧が出ます。\n定期実行は同じ日の後の起動でも撮り直します。同じ日の2回目以降の不採用は通知しません（各実行の step summary に残ります）。\n<" + $url + "|実行ログ>")
                }
              }]
            }]
          }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
