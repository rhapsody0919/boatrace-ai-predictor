name: E2E Re-record (録画の自動撮り直し)

# PRゲートの E2E が再生する録画を、毎日 master で撮り直す（BOA-466、ADR-0077）。
#
# 背景: データ取得部分（supabaseDataService.js）を変える PR が1日に何本も入る。PR ごとに
# 人手で撮り直す前提は成り立たず、撮り直さないと録画に無い通信が増えていく（PRゲートは
# 素通しして一覧に出すが、素通しが多いほど本番依存に戻る）。
#
# 手順（BOA-799、2026-10-12〜。1ジョブ→3ジョブに分割）:
#   1. [record] 本番に繋いで全件を録画する（E2E_RECORD=1）。録画データを artifact で渡す
#   2. [replay] 撮った録画だけで再生して全件実行する（E2E_REPLAY_STRICT=1: 録画に無い通信は abort）。
#      #1318（BOA-769 E）と同じ spec 単位の3分割で並行に走らせる
#   3. [judge] 3分割のレポートを集約し、採用条件を満たすときだけ採用する
#      - 2 が全件通る
#      - skip が現行の録画より増えていない（発走前のレースが少ない日に撮ると skip が増える）
#      - 3分割の全テストがちょうど1回ずつ走った（check-e2e-shard-coverage.js、#1318と共用）
#      採用したら GitHub Release に zip で添付し、ポインタ（e2e/recording.json）を master に
#      直接 push する（push-with-retry.sh。regenerate-generated-docs.yml と同じ流儀）。
#      push はアプリ ryujin-bot のトークンで行う（master の ruleset の bypass のため）。この push で
#      起動しうるワークフローは、[automated] のコミットでは動かない条件を持つ（regenerate-generated-docs・
#      quality-gates）か、paths で e2e/recording.json を対象にしていない（post-merge-checks）
#      古い録画 Release も消す（直近14件を残す）
#   採用しなかった・失敗したときは Slack に通知する（定期実行は1日1回まで。下記）
#
# なぜ3ジョブに分けたか（BOA-799）: 以前は1ジョブ・timeout-minutes 90 で、録画と再生を
# 合わせた所要が90分に迫り、再生の途中でタイムアウト→cancelled になる日が増えていた
# （2026-10-05/07(×2)/08/10/11の直近1週間で6回）。録画の所要が #1318（E2Eのshard化）以降も
# 伸び続けており（2026-10-02: 約26〜34分 → 2026-10-11: 約67分、実測）、再生（録画件数と同じ
# ペースで伸びる。2026-10-02: 約24〜33分 → 2026-10-09: 約40分）を同じ90分に押し込められなく
# なった。録画はテスト件数の増加と本番応答の遅さの両方で伸びている可能性があり（録画の伸びが
# 再生の伸びより大きい）、本調査では録画自体の分割（1本のHARを3並列で書き込む不整合リスクが
# あり見送った）までは行わない。録画の伸びが続く場合は別途チケット化する。
#
# ジョブを分けた設計:
#   - record: 録画を1ジョブのまま（HARファイルは1回の実行で1本に束ねる必要があり、
#     3並列で同時に書き込むと録画の整合性が崩れるリスクがあるため分割しない）。
#     timeout-minutes を90（以前の全体と同じ値）に戻し、再生と共有しない専用の予算にする
#   - replay: 3つに分けて並行に走らせる（#1318と同じ spec 単位の分け方）。
#     record が artifact で渡した録画（e2e/recordings/）をダウンロードして使う
#   - judge: 3分割のレポートを集約し、採用判定・Release公開・古い録画の削除・Slack通知を行う。
#     ryujin-bot のトークンを使うため environment: ryujin-bot はこのジョブだけに付ける
#     （record・replay は本番Supabaseの読み取り専用キーしか使わず、environment は不要）
#   - 3ジョブとも同じコミット（record が解決したSHA）を checkout する。ジョブをまたいで
#     `ref: master` を名前で再解決すると、ジョブの間に master が進んだ場合、録画と再生で
#     違うコードのテストを比べることになる
#
# 起動は1日4回（JST 10:23 / 12:47 / 14:37 / 16:13）。毎時0分は負荷が集中するため避ける
# （公式: "High load times include the start of every hour" /
# "schedule your workflow to run at a different time of the hour"）。
# GitHub の schedule は数時間遅れ、取りこぼされることもある。2026-09-30 は JST11:00 の
# 予定が 17:15 に、2026-10-01 は JST10:23 の予定が 16:15・12:47 の予定が 19:27 に起動した
# （このリポジトリの他の定期実行も1〜6時間の遅れが常態）。起動を4回に増やし、1回が
# 不採用・遅延でも同じ日のうちに撮り直せるようにする。
# その日（JST）の録画を採用済みなら、後の起動は何もせず終わる（二重に撮らない）。
# 遅れて JST19時以降に起動したときも撮らない（発走前のレースが夜間開催の数場だけになる）。
# 判定は scripts/maintenance/e2e-recording.js gate。人が起こす workflow_dispatch（gate=false、既定）は判定せずに撮る。
#
# 起動の出元（BOA-929、2026-10-20〜）: GitHub の schedule はこのリポジトリでは欠落が常態で（10/02 を最後に
# 18日撮れていなかった）、主の起動を Vercel Cron（api/cron/e2e-rerecord-dispatch.js、vercel.json の同じ4つの時刻）
# からの workflow_dispatch（inputs.gate=true）に移した。gate=true は schedule と同じ扱い（採用済み・JST19時以降は
# 撮らない、Slack 通知の1日1回）。下の schedule は予備として残す。dispatch と予備が両方来ても、concurrency で
# 後の起動が待ち、前の起動が採用していれば gate で撮らない。
# 同時に2本は走らない（concurrency）。後の起動は前の起動の終了を待ってから master を
# checkout するので、前の起動が push したポインタで「採用済み」を判定できる。
#
# Slack 通知: 定期実行（schedule・gate=true の dispatch）の「採用しなかった・撮らなかった」は、
# 同じ日（JST）に別の実行が通知済みなら出さない（e2e-recording.js notify-dedupe）。4回とも不採用でも
# 通知は1回で、2回目以降の結果は各実行の step summary に残る。ワークフロー自体の失敗（ステップの失敗）と
# 人が起こす workflow_dispatch（gate=false）は毎回通知する。
# 必要な権限: contents: write（Release の作成・削除とポインタの push）、
# actions: read（その日の他の実行が通知済みかを見る）。
# 使う Secrets: VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY（本番の読み取りのみ、repoのSecrets）、
# SLACK_WEBHOOK_URL、RYUJIN_BOT_APP_ID / RYUJIN_BOT_PRIVATE_KEY（judgeジョブのみ、environment ryujin-bot）

on:
  schedule:
    # 採用済みなら後の起動は何もしない。時刻は JST10〜17時に散らし、0分を避ける
    - cron: '23 1 * * *' # JST 10:23
    - cron: '47 3 * * *' # JST 12:47
    - cron: '37 5 * * *' # JST 14:37
    - cron: '13 7 * * *' # JST 16:13
  workflow_dispatch:
    inputs:
      gate:
        description: '定期実行と同じ判定をする（採用済み・JST19時以降は撮らない）。Vercel Cron が true で起動する'
        type: boolean
        default: false

# 起動が遅れて重なっても、同時には走らせない（後の起動は前の起動の終了を待ち、
# checkout した master のポインタで「採用済み」を判定する）
concurrency:
  group: e2e-rerecord
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      run: ${{ steps.gate.outputs.run }}
      notify: ${{ steps.gate.outputs.notify }}
      result: ${{ steps.gate.outputs.result }}
      sha: ${{ steps.resolve-sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      # replay・judge も同じコミットを見るようにする（ジョブの間にmasterが進んでも、
      # 録画と再生で違うコードのテストを比べないため）
      - name: 使うコミットを固定する
        id: resolve-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 撮り直すか（定期実行のみ）
        id: gate
        env:
          # 定期実行 = schedule か、Vercel Cron の dispatch（inputs.gate=true）。
          # github.event.inputs は常に文字列（schedule では空）
          SCHEDULED: ${{ github.event_name == 'schedule' || github.event.inputs.gate == 'true' }}
        run: |
          if [ "$SCHEDULED" != "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESULT=$(node scripts/maintenance/e2e-recording.js gate)
          echo "$RESULT"
          {
            echo "run=$(echo "$RESULT" | jq -r '.run')"
            # 採用済みで空振りしたときは通知しない。遅れて撮れなかったときは通知する
            echo "notify=$(echo "$RESULT" | jq -r '.notify')"
            echo "result=$RESULT"
          } >> "$GITHUB_OUTPUT"
          REASON=$(echo "$RESULT" | jq -r '.reasons | join("; ")')
          if [ -n "$REASON" ]; then
            echo "## E2E 録画の撮り直し: 撮らずに終了（$REASON）" >> "$GITHUB_STEP_SUMMARY"
          fi

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - run: npx playwright install --with-deps chromium
        if: steps.gate.outputs.run == 'true'

      - name: 録画（本番に繋いで全件）
        id: record
        if: steps.gate.outputs.run == 'true'
        env:
          CI: true
          E2E_RECORD: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set +e
          npx playwright test > record.log 2>&1
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          tail -40 record.log
          # 録画中のテストの成否は採用条件にしない（本番データでは落ちるテストがありうる）。
          # 採用は次の「撮った録画だけでの再生」で判定する。録画そのものができていなければ落とす
          test -f e2e/recordings/api.har

      # replay ジョブ（別マシン）へ録画データを渡す
      - name: Upload recordings (replayジョブへ渡す)
        if: steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-recordings
          path: e2e/recordings/
          retention-days: 1

      - name: Upload record log
        if: always() && steps.gate.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-record-log
          path: record.log
          retention-days: 7

  # #1318（BOA-769 E）と同じ spec 単位の3分割で並行に再生する。録画は1本のHARに束ねる
  # 必要があり3並列での同時書き込みは不整合のリスクがあるため分割しないが、再生は
  # 録画済みのファイルを読むだけ（書き込みをしない）ので分割して問題ない
  replay:
    needs: record
    if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            args: e2e/smoke.spec.js e2e/race-odds-live.spec.js
          - shard: 2
            args: e2e/layout.spec.js e2e/race-detail-details.spec.js
          - shard: 3
            args: --grep-invert "(^|[ /])(smoke|race-odds-live|layout|race-detail-details)\.spec\.js( |$)"
    name: replay (${{ matrix.shard }}/${{ strategy.job-total }})
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.record.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Download recordings
        uses: actions/download-artifact@v4
        with:
          name: e2e-rerecord-recordings
          path: e2e/recordings/

      - name: 撮った録画だけで再生（録画に無い通信は abort）
        env:
          CI: true
          E2E_RECORDING_SOURCE: local
          E2E_REPLAY_STRICT: '1'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        run: npx playwright test --fully-parallel --reporter=list,blob ${{ matrix.args }} 2>&1 | tee replay.log

      - name: Upload replay log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-replay-log-${{ matrix.shard }}
          path: replay.log
          retention-days: 7

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-blob-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

      - name: Upload Playwright trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-traces-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # 3分割のレポートを集約し、採用判定・Release公開・古い録画の削除・Slack通知を行う。
  # record・replayが（gateでrun=falseだった等の理由で）走らなくても、Slack通知のために
  # 必ず実行する（if: always()）
  judge:
    needs: [record, replay]
    if: always()
    runs-on: ubuntu-latest
    # ryujin-bot のトークン（Create ryujin-bot token ステップ）を使うため、このジョブだけ
    # environment ryujin-bot を付ける（Deployment branches: master だけ。別ブランチの
    # workflow_dispatch等からbypass用のトークンを作らせないため）
    environment: ryujin-bot
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.record.outputs.sha || 'master' }}

      # SHA を checkout すると detached HEAD になり、「git branch --show-current が空＝
      # push先ブランチを特定できない」で後段のpush処理が必ず失敗する。ローカルブランチ名を
      # master にしておけば、origin/master へ fetch・rebase・push する既存の仕組みがそのまま働く
      - name: ブランチを作る（detached HEAD のままだと後段のpushが失敗するため）
        run: git checkout -B master

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'

      - name: Download replay blobs
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-rerecord-blob-*
          path: all-blob-reports
          merge-multiple: true

      # merge-reports はテストが落ちていても終了コード0を返す。合否は次の「採用判定」で決める
      - name: Merge reports
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-results.json
        run: npx playwright merge-reports --reporter=dot,json all-blob-reports

      - name: Download recordings (公開用)
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
        uses: actions/download-artifact@v4
        with:
          name: e2e-rerecord-recordings
          path: e2e/recordings/

      - name: 採用判定
        id: judge
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
        run: |
          set +e
          if [ ! -f e2e-results.json ]; then
            RESULT='{"adopt":false,"reasons":["再生のレポート（e2e-results.json）が無い。再生が途中で止まった"]}'
          else
            RESULT=$(node scripts/maintenance/e2e-recording.js judge e2e-results.json)
          fi
          CODE=$?
          if ! echo "$RESULT" | jq -e '.adopt == true' >/dev/null; then CODE=3; fi
          echo "$RESULT"
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$CODE" -eq 0 ]; then echo "adopt=true" >> "$GITHUB_OUTPUT"; else echo "adopt=false" >> "$GITHUB_OUTPUT"; fi
          {
            echo "## E2E 録画の撮り直し"
            echo '```json'
            echo "$RESULT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      # 不採用の原因（どのテストが落ちた・skipが増えたか）をstep summary以上に深掘りしたいとき用。
      # merge-reports が作る集約レポート自体はこのジョブのランナー上だけに残り、ジョブ終了で消える
      - name: Upload merged results
        if: needs.record.result == 'success' && needs.record.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rerecord-results
          path: e2e-results.json
          retention-days: 7

      # 3分割（replayのmatrix）が全テストを1回ずつ走らせたか（#1318のe2e-shardと同じ検査を
      # 共用する）。ここが失敗すると後続のステップは（bareのif:がsuccess()を含意するため）
      # 自動的にスキップされ、採用しない扱いになる
      - name: Check shard coverage
        if: needs.record.outputs.run == 'true' && steps.judge.outputs.adopt == 'true'
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: e2e-list.json
        run: |
          npx playwright test --list --reporter=json
          node scripts/maintenance/check-e2e-shard-coverage.js e2e-list.json e2e-results.json

      # master への push はアプリ ryujin-bot の名義で行う（master の ruleset の bypass に GITHUB_TOKEN は入れられないため）。
      # トークンの有効期限は1時間なので、checkout ではなく push の直前に作る
      - name: Create ryujin-bot token
        id: app-token
        if: ${{ github.ref == 'refs/heads/master' && steps.judge.outputs.adopt == 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RYUJIN_BOT_APP_ID }}
          private-key: ${{ secrets.RYUJIN_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Release に添付してポインタを更新
        if: steps.judge.outputs.adopt == 'true'
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.judge.outputs.result }}
        run: |
          SKIPPED=$(echo "$RESULT" | jq '.counts.skipped')
          TESTS=$(echo "$RESULT" | jq '.counts.tests')
          node scripts/maintenance/e2e-recording.js publish --skipped="$SKIPPED" --tests="$TESTS"
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add e2e/recording.json
          git commit -m "chore: E2Eの録画を撮り直した [automated]"
          # master の更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh

      - name: 古い録画 Release を消す（直近14件を残す）
        if: steps.judge.outputs.adopt == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/maintenance/e2e-recording.js prune --keep=14

      - name: Notify Slack (採用しなかった・失敗したとき)
        # record job が gate ステップ到達前（checkout・resolve-sha・setup-node・gate自身の
        # クラッシュ等）に失敗すると、run/notify 出力が未設定（空文字）のまま replay・judge の
        # 各stepが（failureではなく）skipになり、judge job自身は失敗しない。その場合
        # failure() も notify=='true' もどちらも真にならずSlack通知が出なかった（BOA-799で検出）。
        # needs.record.result で record job自体の失敗も直接見る
        if: >-
          always() && (failure() || needs.record.result == 'failure' ||
          needs.record.result == 'cancelled' || needs.record.outputs.notify == 'true' ||
          (needs.record.outputs.run == 'true' && steps.judge.outputs.adopt != 'true'))
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RESULT: ${{ steps.judge.outputs.result || needs.record.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCHEDULED: ${{ github.event_name == 'schedule' || github.event.inputs.gate == 'true' }}
          # failure() は if: の中でしか使えない（env に書くとワークフロー全体が無効になる）。
          # env では job.status で同じ判定をする
          JOB_FAILED: ${{ job.status == 'failure' }}
          # record ジョブ自体の失敗・取り消しも「ワークフロー自体の失敗」として毎回通知する
          # （judge の job.status には出ない。dedupe で黙らせない）
          RECORD_RESULT: ${{ needs.record.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL が未設定のため通知できません"
            exit 0
          fi
          # 定期実行の「採用しなかった・撮らなかった」は1日1回だけ通知する（同じ日に別の
          # 定期実行が通知済みなら出さない）。ワークフロー自体の失敗（push の失敗等）は
          # 理由が別なので必ず通知する。checkout 前に落ちてスクリプトが無いときも通知する
          if [ "$SCHEDULED" = "true" ] && [ "$JOB_FAILED" != "true" ] && [ "$RECORD_RESULT" = "success" ]; then
            DEDUPE=$(node scripts/maintenance/e2e-recording.js notify-dedupe 2>/dev/null || echo '{"notify":true}')
            echo "$DEDUPE"
            if [ "$(printf '%s' "$DEDUPE" | jq -r '.notify')" = "false" ]; then
              echo "## Slack 通知を省略（$(printf '%s' "$DEDUPE" | jq -r '.reasons | join("; ")')）" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          REASONS=$(printf '%s' "$RESULT" | jq -r '.reasons // [] | join("\n")' 2>/dev/null)
          if [ -z "$REASONS" ]; then REASONS="ワークフローが途中で失敗した（採用判定の前後）"; fi
          PAYLOAD=$(jq -n --arg reasons "$REASONS" --arg url "$RUN_URL" '{
            attachments: [{
              color: "#e67e22",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: (":warning: *E2Eの録画を撮り直せませんでした（現行の録画のまま）*\n```" + $reasons + "```\nPRゲートは現行の録画で動き続けます。録画に無い通信は本番へ素通しされ、PRコメントに一覧が出ます。\n定期実行は同じ日の後の起動でも撮り直します。同じ日の2回目以降の不採用は通知しません（各実行の step summary に残ります）。\n<" + $url + "|実行ログ>")
                }
              }]
            }]
          }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$PAYLOAD"
