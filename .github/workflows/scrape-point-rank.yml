name: Scrape Point Rank

on:
  schedule:
    - cron: '0 13 * * *' # JST 22:00（当日全レース結果確定後）
  workflow_dispatch:

concurrency:
  group: scrape-point-rank
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    # リポジトリ変数 SKIP_POINT_RANK_ON_GHA=true の間は、この取得を行わない（Vercel Cron の point_rank（api/cron/point-rank.js） へ移した後の、
    # GitHub側の停止。コードは削除しない。未設定・"true"以外なら従来どおり実行する。切り戻しは変数を消す（false）だけ。
    # 手順: docs/design/scraping-vercel-consolidation/verification-runbook.md L）
    if: ${{ vars.SKIP_POINT_RANK_ON_GHA != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Scrape point rank (今節得点率)
        run: node scripts/daily/scrape-point-rank.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
