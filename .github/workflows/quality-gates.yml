name: Quality Gates

# scripts/maintenance/verify-*.js のうち tier=ci のものを、PRごとにまとめて実行する。
#
# 背景: 2026-09-25時点で verify-*.js は57本あったが、CIから実行されていたのは
# 1本だけで、残りは「書いた時に手元で1回走らせて以後誰も実行しない」状態だった。
# 実際にマイグレーション番号063の重複がmasterに入ったまま検知されなかった。
# 分類台帳は scripts/maintenance/verify-registry.json、設計は
# docs/design/quality-gate-ci/spec.md を参照。
#
# 旧 verify-query-errors.yml はこのワークフローに統合して削除した。

on:
  pull_request:
    branches:
      - master
  # masterへのマージ後にも1回走らせる。masterにブランチ保護が無く
  # "Require branches to be up to date" も効かないため、2つのPRが同じ
  # 時点のmasterに対して緑になり、片方がマージされた後にもう片方が
  # 再検証されずマージされうる（063の番号重複はこの経路で入った）。
  # マージ後に走らせることで、少なくとも検知はできる状態にする。
  push:
    branches:
      - master

# PRへのpushは同じPRの古い実行を止める（同じheadブランチでgroupを束ねる）。
# masterへのpushはそれぞれ独立に最後まで走らせたいので、run_idで一意にしてcancelしない
# （masterの定期pushやe2e-rerecord等と無関係に、このワークフロー自身の push トリガーを連続で止めないため）。
# （この行は、同じPRへの2回目のpushで古い実行がcancelされることを確認するための検証用コメント）
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # verify-migration-numbers.js が --base=origin/master で
          # base の最大マイグレーション番号を git ls-tree で読むため、
          # master の参照が要る
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # verify-actionlint.js が使う actionlint・shellcheck を固定版で取得し、sha256 を照合する
      # （BOA-659）。verify:ci の中では外部ネットワークに触れないため、ここで先に取る
      - name: Install actionlint and shellcheck
        run: npm run setup:actionlint

      - name: Run CI-tier verifications
        run: npm run verify:ci

  # scripts/ml/ の変更があるときだけ、アナロジー・ファインダーの学習の pytest（as-of・リーク防止・
  # ラウンド区分・集計・品質ゲート）を回す。以前は train-analogy.yml の手動実行時にしか走らなかった
  # （データサイエンス体制のレビュー、2026-10-02）
  ml-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: scripts/ml/ に変更があるか
        id: changed
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if git diff --quiet "$BASE" HEAD -- scripts/ml/ src/constants/raceStageConfig.js; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.changed.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python deps
        if: steps.changed.outputs.run == 'true'
        run: pip install -r scripts/ml/analogy/requirements.txt

      # ラウンド区分のテストは node で src/constants/raceStageConfig.js を読む（依存パッケージは不要）
      - name: pytest (scripts/ml/analogy/tests)
        if: steps.changed.outputs.run == 'true'
        run: python -m pytest scripts/ml/analogy/tests -q
