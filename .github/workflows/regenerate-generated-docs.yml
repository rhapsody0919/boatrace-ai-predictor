name: Regenerate Generated Docs

# 機械生成の文書（scripts/maintenance/generated-docs.js の一覧）を、masterへのpushごとに
# 作り直し、差分があればコミットする（ADR-0078）。
#
# 背景: 生成物をPRに含めていたころは、PRがマージされるたびにmaster側の生成物が変わり、
# 並行している他のPRが同じファイルでコンフリクトしていた。GitHubのマージ（mergeable判定・
# Mergeボタン・gh pr merge）は .gitattributes のマージドライバを使わないため、
# 属性（merge=ours 等）では解消できない。そこで生成物はPRに含めず（verify-generated-docs-not-in-pr.js
# が検査）、マージ後にここで作り直す。
#
# このワークフローが作るコミットはアプリ ryujin-bot のトークンで push する（master の ruleset の
# bypass に GITHUB_TOKEN は入れられないため）。アプリのトークンの push は、GITHUB_TOKEN と違って
# 他のワークフロー（このワークフロー自身を含む）を起動する。無限ループにならないよう、ボットの
# push（actor が ryujin-bot[bot]、または先端のコミットのメッセージが [automated] で終わる）では動かない。
# 末尾で判定するのは、人のマージのメッセージ本文に [automated] という語が出ても止めないため。
# ボットの push は生成物の入力（scripts/・src/ 等）を変えないので、作り直しを省いても生成物は古くならない
# （GITHUB_TOKEN で push していたころも、自動コミットでは起動していなかった）。

on:
  push:
    branches:
      - master
  workflow_dispatch:

# 実行中のものは止めない（push の途中で止めると中途半端になるため）。
# 待機中のものは新しい push で置き換わるので、最終的に最新の master から1回作り直される。
concurrency:
  group: regenerate-generated-docs
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    # ボットの push では動かない（上記。workflow_dispatch は head_commit が無いので常に動く）
    if: >-
      github.actor != 'ryujin-bot[bot]' &&
      !endsWith(github.event.head_commit.message, '[automated]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 起動したコミットではなく、その時点の master の先端から作り直す
      # （待機中に後続の push があっても、最新のソースを反映させるため）
      - uses: actions/checkout@v4
        with:
          ref: master

      # 生成スクリプトは Node 標準モジュールだけを使うので npm ci は不要
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Regenerate
        run: node scripts/maintenance/generated-docs.js regenerate

      # master への push はアプリ ryujin-bot の名義で行う（master の ruleset の bypass に GITHUB_TOKEN は入れられないため）。
      # トークンの有効期限は1時間なので、checkout ではなく push の直前に作る
      - name: Create ryujin-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RYUJIN_BOT_APP_ID }}
          private-key: ${{ secrets.RYUJIN_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push if changed
        run: |
          mapfile -t paths < <(node scripts/maintenance/generated-docs.js paths)
          git add -- "${paths[@]}"
          if git diff --staged --quiet; then
            echo "生成物に差分なし"
            exit 0
          fi
          git diff --staged --stat
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "chore: 機械生成の文書を再生成 [automated]"
          # master の更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Notify Slack on failure
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "::warning::SLACK_WEBHOOK_URL が未設定のため通知できません"
            exit 0
          fi
          # payload は jq で組み立てる（文字列への変数の直書きで JSON が壊れないように。BOA-644）
          payload=$(jq -n --arg url "$RUN_URL" '{
            text: ("機械生成の文書（共通ロジック索引・表示カバレッジ台帳）の再生成に失敗しました。masterの生成物が古いままです: " + $url)
          }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
