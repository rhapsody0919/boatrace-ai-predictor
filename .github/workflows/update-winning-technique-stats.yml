name: Update Winning Technique Stats

on:
  schedule:
    - cron: '35 15 * * *' # JST 00:35 (UTC 15:35)
  workflow_dispatch:

permissions:
  contents: read

# 手動実行と定期実行が重なると、会場ごとの delete→insert が交互に走って書き込みが衝突する（BOA-430）
concurrency:
  group: update-winning-technique-stats
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run update script
        run: node scripts/daily/update-winning-technique-stats.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
