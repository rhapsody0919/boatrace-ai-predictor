name: Scrape Venue Motor Stats

on:
  schedule:
    - cron: '0 21 * * *' # JST 06:00（本日のレース開始前、scrape-scheduled.ymlの稼働窓の前）
  workflow_dispatch:

concurrency:
  group: scrape-venue-motor-stats
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Scrape venue motor stats
        run: node scripts/daily/scrape-venue-motor-stats.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
