name: Scrape Venue Motor Stats

on:
  schedule:
    - cron: '0 21 * * *' # JST 06:00（本日のレース開始前、scrape-scheduled.ymlの稼働窓の前）
  workflow_dispatch:

concurrency:
  group: scrape-venue-motor-stats
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # SKIP_MOTOR_STATS_ON_GHA=true の間は、Vercel が健全な場合に限り、この取得を行わない（フェイルセーフ付きSKIP）。
  # 変数が未設定・true 以外なら、この gate ジョブは起動せず（DB も読まない）、従来どおり取得ジョブが実行される。
  # true のときは、scrape_job_state の venue_motor_stats（と取得先のブレーカー）を読み、Vercel が live で
  # 対象日を処理済みのときだけスキップする。live でない・処理が済んでいない・状態を読めない（gate ジョブの失敗を含む）
  # ときは、実行する（自動フェイルオーバー）。判定の定義: scripts/lib/ghaSkipGate.js、
  # docs/design/scraping-vercel-consolidation/verification-runbook.md P。--wait は、指定時刻の直後に Vercel の完了を最大10分待つ
  gate:
    if: ${{ vars.SKIP_MOTOR_STATS_ON_GHA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether Vercel handles this job
        id: gate
        continue-on-error: true
        run: node scripts/maintenance/gha-skip-gate.js SKIP_MOTOR_STATS_ON_GHA --wait
        env:
          SKIP_MOTOR_STATS_ON_GHA: ${{ vars.SKIP_MOTOR_STATS_ON_GHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  scrape:
    # 未設定・true 以外: gate は skipped（outputs は空）→ 従来どおり実行。true: gate の判定がスキップなら実行しない。
    # !cancelled() は、gate が skipped・失敗のときも、この取得ジョブを実行するため（フェイルセーフ）
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    # アプリ ryujin-bot の Secrets は environment ryujin-bot（Deployment branches: master だけ）に置く。
    # 別ブランチの workflow_dispatch や、別ブランチに足したワークフローから bypass 用のトークンを作らせないため
    environment: ryujin-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Scrape venue motor stats
        run: node scripts/daily/scrape-venue-motor-stats.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # scrape-venue-motor-stats.jsが更新した会場別の成功/失敗履歴
      # （data/analysis/venue-motor-stats-health.json）をコミットする。
      # 構造変化検知（BOA-285、次のステップ）が翌日以降も履歴を参照できるよう永続化する
      # master への push はアプリ ryujin-bot の名義で行う（master の ruleset の bypass に GITHUB_TOKEN は入れられないため）。
      # トークンの有効期限は1時間なので、checkout ではなく push の直前に作る
      - name: Create ryujin-bot token
        id: app-token
        if: github.ref == 'refs/heads/master'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RYUJIN_BOT_APP_ID }}
          private-key: ${{ secrets.RYUJIN_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit health tracking updates if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/analysis/venue-motor-stats-health.json
          git diff --staged --quiet || git commit -m "chore: 会場別モーター成績スクレイピングの成否履歴を更新 [automated]"
          # masterの更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}

      # 会場公式サイトのHTML構造変化を検知する（BOA-285）。新規HTTPリクエストは
      # 行わず、上記スクレイピングが書き込んだ履歴ファイルを読むだけ
      - name: Check for site structure drift
        id: drift
        run: |
          set +e
          OUTPUT=$(node scripts/maintenance/check-venue-motor-stats-drift.js)
          EXIT_CODE=$?
          echo "$OUTPUT"
          # 区切りが固定だと、ログに区切りと同じ行があった時点で値が切れ、残りが出力の行として読まれる。
          # 毎回ランダムな区切りにする（BOA-652）
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "summary<<$delim"
            echo "$OUTPUT"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (構造変化の疑いを検知した場合のみ)
        if: steps.drift.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
        # payload は jq で組み立てる（ログの " ・改行・\ で JSON が壊れないように。BOA-644）。
        # section の text の上限3000文字を超えないよう、ログだけを切り詰める
        run: |
          payload=$(jq -n --arg summary "$SUMMARY" '
            ":warning: *会場公式サイトのHTML構造変化の疑いを検知（BOA-285）*\n" as $head
            | "\n公式サイトのモーター成績ページの構造が変わり、パーサーが正しく取得できなくなっている可能性があります。scripts/lib/venueMotorStats/parsers/ 配下の該当パーサーを確認してください" as $tail
            | {
                attachments: [{
                  color: "#c9a227",
                  blocks: [{
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ($head + "```" + ($summary | .[0:(2900 - ($head + $tail | length))]) + "```" + $tail)
                    }
                  }]
                }]
              }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
