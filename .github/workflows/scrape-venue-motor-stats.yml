name: Scrape Venue Motor Stats

on:
  schedule:
    - cron: '0 21 * * *' # JST 06:00（本日のレース開始前、scrape-scheduled.ymlの稼働窓の前）
  workflow_dispatch:

concurrency:
  group: scrape-venue-motor-stats
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Scrape venue motor stats
        run: node scripts/daily/scrape-venue-motor-stats.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # scrape-venue-motor-stats.jsが更新した会場別の成功/失敗履歴
      # （data/analysis/venue-motor-stats-health.json）をコミットする。
      # 構造変化検知（BOA-285、次のステップ）が翌日以降も履歴を参照できるよう永続化する
      - name: Commit health tracking updates if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/analysis/venue-motor-stats-health.json
          git diff --staged --quiet || git commit -m "chore: 会場別モーター成績スクレイピングの成否履歴を更新 [automated]"
          # masterの更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh

      # 会場公式サイトのHTML構造変化を検知する（BOA-285）。新規HTTPリクエストは
      # 行わず、上記スクレイピングが書き込んだ履歴ファイルを読むだけ
      - name: Check for site structure drift
        id: drift
        run: |
          set +e
          OUTPUT=$(node scripts/maintenance/check-venue-motor-stats-drift.js)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "summary<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (構造変化の疑いを検知した場合のみ)
        if: steps.drift.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"#c9a227\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \":warning: *会場公式サイトのHTML構造変化の疑いを検知（BOA-285）*\n\`\`\`${SUMMARY}\`\`\`\n公式サイトのモーター成績ページの構造が変わり、パーサーが正しく取得できなくなっている可能性があります。scripts/lib/venueMotorStats/parsers/ 配下の該当パーサーを確認してください\"
                    }
                  }
                ]
              }]
            }"
