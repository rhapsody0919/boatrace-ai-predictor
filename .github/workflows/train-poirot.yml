name: Train Poirot Models

# ポアロ予想 V1(RandomForest)/V2(LightGBM) を週次で再学習し、
# 学習済みモデルを Supabase Storage の `poirot` バケットへアップロードする。
# モデルはバイナリで大きいため git ではなく Storage で管理する。

on:
  schedule:
    # JST 日曜 03:00 = UTC 土曜 18:00（train-sherlock の30分後）
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    # data/watson/model.json（ワトソンのメタデータ）の自動コミットに必要
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python deps
        run: pip install -r scripts/ml/requirements.txt

      - name: Export training data from Supabase
        run: node scripts/ml/export-training-data.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # backfill CSV は CI に存在しないため Supabase 蓄積分のみで学習する
      # （features.load_dataset は backfill が無ければ自動で Supabase のみを使用）
      - name: Train V1 (RandomForest)
        working-directory: scripts/ml
        run: python train_rf.py

      - name: Train V2 (LightGBM)
        working-directory: scripts/ml
        run: python train_v2.py

      # ワトソンの ΔR² 評価は export-training-data.js が出力する odds.csv を使う
      - name: Train Watson (LightGBM LambdaRank)
        working-directory: scripts/ml
        run: python train_watson.py

      # マイクロフト（PyTorch）。torch は 200MB超あるため共通の requirements とは
      # 分け、このステップの直前でのみ入れる
      - name: Install Mycroft deps (torch)
        run: pip install -r scripts/ml/requirements-mycroft.txt
        continue-on-error: true

      # CPU のみで全データ2エポック390秒（ローカル実測、実効1.5コア相当）。
      # 早期終了まで8〜13エポックのため 15〜50分の見込みで、週次なら十分収まる。
      # 失敗しても続行する: models/mycroft_v1.pt が生成されなければ次の
      # アップロードが警告付きでスキップし、Storage は直前の正常なモデルを保つ
      - name: Train Mycroft (Transformer)
        working-directory: scripts/ml
        run: python train_mycroft.py
        continue-on-error: true

      - name: Upload models to Supabase Storage
        run: node scripts/ml/storage-models.js upload
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/watson/model.json data/mycroft/model.json
          git diff --staged --quiet || git commit -m "chore: update watson/mycroft model metadata [automated]"
          git push
