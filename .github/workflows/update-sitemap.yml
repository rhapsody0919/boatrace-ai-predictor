name: Update Sitemap

on:
  schedule:
    # JST 23:30 = UTC 14:30（全レース終了後、stats集計前）
    - cron: '30 14 * * *'
  workflow_dispatch:

concurrency:
  group: update-sitemap
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Generate sitemap
        run: node scripts/generate-sitemap.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Generate llms.txt
        run: node scripts/generate-llms-txt.js

      - name: Check for sitemap changes
        id: sitemap_diff
        run: |
          git add public/sitemap.xml public/llms.txt
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.sitemap_diff.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git commit -m "chore: update sitemap [automated]"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Vercel Deploy
        if: steps.sitemap_diff.outputs.changed == 'true'
        run: curl -X POST "${{ secrets.VERCEL_DEPLOY_HOOK }}"

      # sitemap変更時のみGoogleへ再送信を通知（BOA-152関連: SEO未対応の是正）
      # サービスアカウントがSearch Consoleで「フル」権限を持つ場合のみ成功する
      - name: Create credentials directory
        if: steps.sitemap_diff.outputs.changed == 'true'
        run: mkdir -p credentials

      - name: Write service account key
        if: steps.sitemap_diff.outputs.changed == 'true'
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: echo "$GOOGLE_SERVICE_ACCOUNT_KEY" > credentials/google-service-account.json

      - name: Submit sitemap to Search Console
        if: steps.sitemap_diff.outputs.changed == 'true'
        continue-on-error: true # サービスアカウントが未設定/権限不足でも sitemap 更新自体は失敗させない
        run: node scripts/submit-sitemap.js
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/google-service-account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}

      - name: Clean up credentials
        if: always()
        run: rm -f credentials/google-service-account.json
