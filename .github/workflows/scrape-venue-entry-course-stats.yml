name: Scrape Venue Entry Course Stats

on:
  schedule:
    # JST 20:00（本日のレースが概ね終了し、race_entries（当日の出走表）が
    # 差し替えなく確定している時間帯。本データは選手の全国直近12ヶ月実績で
    # 当日の結果には依存しないため、発走前に急いで取得する必要はない）
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: scrape-venue-entry-course-stats
  cancel-in-progress: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # SKIP_ENTRY_COURSE_ON_GHA=true の間は、Vercel が健全な場合に限り、この取得を行わない（フェイルセーフ付きSKIP）。
  # 変数が未設定・true 以外なら、この gate ジョブは起動せず（DB も読まない）、従来どおり取得ジョブが実行される。
  # true のときは、scrape_job_state の entry_course_stats（と取得先のブレーカー）を読み、Vercel が live で
  # 対象日を処理済みのときだけスキップする。live でない・処理が済んでいない・状態を読めない（gate ジョブの失敗を含む）
  # ときは、実行する（自動フェイルオーバー）。判定の定義: scripts/lib/ghaSkipGate.js、
  # docs/design/scraping-vercel-consolidation/verification-runbook.md P。--wait は、指定時刻の直後に Vercel の完了を最大10分待つ
  gate:
    if: ${{ vars.SKIP_ENTRY_COURSE_ON_GHA == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.gate.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check whether Vercel handles this job
        id: gate
        continue-on-error: true
        run: node scripts/maintenance/gha-skip-gate.js SKIP_ENTRY_COURSE_ON_GHA --wait
        env:
          SKIP_ENTRY_COURSE_ON_GHA: ${{ vars.SKIP_ENTRY_COURSE_ON_GHA }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

  scrape:
    # 未設定・true 以外: gate は skipped（outputs は空）→ 従来どおり実行。true: gate の判定がスキップなら実行しない。
    # !cancelled() は、gate が skipped・失敗のときも、この取得ジョブを実行するため（フェイルセーフ）
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Scrape venue entry course stats
        run: node scripts/daily/scrape-venue-entry-course-stats.js
        continue-on-error: true # 他の日次ジョブに影響させない
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # scrape-venue-entry-course-stats.jsが更新した会場別の成功/失敗履歴
      # （data/analysis/venue-entry-course-stats-health.json）をコミットする。
      # 構造変化検知（次のステップ）が翌日以降も履歴を参照できるよう永続化する
      - name: Commit health tracking updates if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/analysis/venue-entry-course-stats-health.json
          git diff --staged --quiet || git commit -m "chore: 進入コース別選手成績スクレイピングの成否履歴を更新 [automated]"
          # masterの更新と競合しても失敗しないよう rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh

      # 会場公式サイトのHTML構造変化を検知する（BOA-293）。新規HTTPリクエストは
      # 行わず、上記スクレイピングが書き込んだ履歴ファイルを読むだけ
      - name: Check for site structure drift
        id: drift
        run: |
          set +e
          OUTPUT=$(node scripts/maintenance/check-venue-entry-course-stats-drift.js)
          EXIT_CODE=$?
          echo "$OUTPUT"
          {
            echo "summary<<EOF"
            echo "$OUTPUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Notify Slack (構造変化の疑いを検知した場合のみ)
        if: steps.drift.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.drift.outputs.summary }}
        run: |
          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"#c9a227\",
                \"blocks\": [
                  {
                    \"type\": \"section\",
                    \"text\": {
                      \"type\": \"mrkdwn\",
                      \"text\": \":warning: *会場公式サイトのHTML構造変化の疑いを検知（BOA-293）*\n\`\`\`${SUMMARY}\`\`\`\n進入コース別選手成績ページの構造が変わり、パーサーが正しく取得できなくなっている可能性があります。scripts/lib/venueEntryCourseStats/parser.js を確認してください\"
                    }
                  }
                ]
              }]
            }"
