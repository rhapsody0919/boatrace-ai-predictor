name: Train Sherlock Model

on:
  schedule:
    # JST 日曜 02:30 = UTC 土曜 17:30（train-moriarty の30分後）
    - cron: '30 17 * * 6'
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest
    # アプリ ryujin-bot の Secrets は environment ryujin-bot（Deployment branches: master だけ）に置く。
    # 別ブランチの workflow_dispatch や、別ブランチに足したワークフローから bypass 用のトークンを作らせないため
    environment: ryujin-bot
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Train Sherlock model (conditional logit + odds blend)
        run: node scripts/analysis/train-conditional-logit.js --fit-production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      - name: Fit Adler temperature parameters (tempered Plackett-Luce)
        run: node scripts/analysis/train-adler-temps.js --fit-production
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      # master への push はアプリ ryujin-bot の名義で行う（master の ruleset の bypass に GITHUB_TOKEN は入れられないため）。
      # トークンの有効期限は1時間なので、checkout ではなく push の直前に作る
      - name: Create ryujin-bot token
        id: app-token
        if: github.ref == 'refs/heads/master'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RYUJIN_BOT_APP_ID }}
          private-key: ${{ secrets.RYUJIN_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data/sherlock/model.json data/adler/model.json
          git diff --staged --quiet || git commit -m "chore: update sherlock/adler models [automated]"
          # 従来は pull せずに push していたため、実行中にmasterが進むと失敗した。rebase+リトライで push する（BOA-360）
          bash scripts/maintenance/push-with-retry.sh
        env:
          PUSH_TOKEN: ${{ steps.app-token.outputs.token }}
