name: Scrape Scheduled

on:
  workflow_dispatch:
  schedule:
    # フォールバック用（プライマリは cron-job.org から workflow_dispatch で5分毎にトリガー）
    # cron-job.org 障害時のバックアップとして JST 7:00-22:00 の10分間隔で実行 (UTC換算)
    - cron: '*/10 22-23,0-13 * * *'

concurrency:
  group: scrape-scheduled
  cancel-in-progress: false  # 朝の初期化を完走させるため

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # scripts/daily/morning-init.js が `git log -1 -- <file>` で
          # generate-predictions.js の最終変更日時を判定するため、デフォルトの
          # 浅いclone（depth=1）だと「HEADコミットの日時」が常に返り、そのコミットが
          # 実際にこのファイルを変更していなくても「変更された」と誤判定していた。
          # このリポジトリは頻繁にコミットが入るため、5分毎の実行のたびに
          # 本日全レースの予測が丸ごと再生成され、的中判定フラグがリセットされ
          # 続けていた（2026-09-06発覚）。フル履歴を取得して正しく判定できるようにする
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 朝の初期化（races テーブルが空の場合のみ scrape-to-json + generate-predictions フルモードを実行）
      - name: Morning initialization
        run: node scripts/daily/morning-init.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        continue-on-error: true

      # スクレイピングオーケストレーター
      # スケジュール取得を1回のみ実行し、対象ウィンドウのレースがあれば必要な処理を実行する。
      # 対象レースがなければ即終了（Egress ゼロ）。データ更新時のみ予測リフレッシュ・Deploy Hook を実行。
      - name: Run scraping orchestrator
        run: node scripts/daily/scrape-scheduled.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
          # BOA-313 Step 3: 展示データはVercel Function(api/cron/exhibition.js)へ移行済み。
          # リポジトリ変数のトグルのみで即座に切り戻せるよう、コード変更・redeployを伴わない形にする。
          SKIP_EXHIBITION_ON_GHA: ${{ vars.SKIP_EXHIBITION_ON_GHA }}
          # WS4b（T4b-02-4・T4b-05-3）: 結果取得はVercel Function(api/cron/result.js)、Kファイル同期は
          # api/cron/kfile-sync.js へ移行する。切り替え後にGitHub側を止めるトグル（既定は未設定＝従来どおり実行）。
          # 設定は、Vercel側がliveで並走し、docs/design/scraping-vercel-consolidation/verification-runbook.md の
          # 手順どおり確認できてから行う（Kファイルは、SKIP_KFILE_ON_GHAを先に、または同時に）。
          SKIP_RESULTS_ON_GHA: ${{ vars.SKIP_RESULTS_ON_GHA }}
          SKIP_KFILE_ON_GHA: ${{ vars.SKIP_KFILE_ON_GHA }}
          # BOA-353 T4b-03（予測リフレッシュ案1）: "true" の間は、オッズ起点の予測リフレッシュを外す
          # （展示・気象の変更を起点にした再計算は、Vercel の REFRESH_ON_VERCEL=true が担う）。
          # 有効化・切り戻しの順序は scripts/lib/predictionRefresh.js。未設定（既定）は従来どおり
          SKIP_ODDS_REFRESH_ON_GHA: ${{ vars.SKIP_ODDS_REFRESH_ON_GHA }}
        continue-on-error: true
