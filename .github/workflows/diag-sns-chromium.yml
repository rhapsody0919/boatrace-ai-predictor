name: diag-sns-chromium
on:
  push:
    branches: [diag/sns-chromium-crash]
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mem: ["2048m"]
        variant: ["new"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - name: run in container (memory ${{ matrix.mem }})
        run: |
          OLD=""; [ "${{ matrix.variant }}" = old ] && OLD=1
          docker run --rm --memory=${{ matrix.mem }} --memory-swap=${{ matrix.mem }} -e OLD=$OLD -v "$PWD":/w -w /w node:22 bash -c 'for i in 1 2; do echo "=== run $i"; node tmp/diag/sonar.mjs 2>&1 | grep -E "^(today|shot|done|close)" | cut -c1-400; done'

      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "shots-${{ matrix.variant }}", path: tmp/diag/*.png }
