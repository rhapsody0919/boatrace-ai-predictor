name: Content Ops Nightly Check

on:
  schedule:
    # JST 深夜0:00 = UTC 15:00
    - cron: '0 15 * * *'
  workflow_dispatch:

concurrency:
  group: content-ops-nightly-check
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check:
    environment: prod-jobs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Run content-ops checks
        id: checks
        env:
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set +e
          OUTPUT=$(node scripts/maintenance/content-ops-checks/nightly-summary.js)
          EXIT_CODE=$?
          echo "$OUTPUT"
          # 区切りが固定だと、ログに区切りと同じ行があった時点で値が切れ、残りが出力の行として読まれる。
          # 毎回ランダムな区切りにする（BOA-652）
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "summary<<$delim"
            echo "$OUTPUT"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: 却下フィードバックの閾値エスカレーション（content-multi-channel-pipeline）
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          LINEAR_TEAM_ID: ${{ secrets.LINEAR_TEAM_ID }}
        id: escalation
        # 失敗の理由（最後の「❌ エラー:」の1行。Linear のエラーコードを含む）を出力に残し、
        # 下の Slack 通知で送る。終了コードはそのまま返し、ジョブは赤にする
        run: |
          set +e
          node scripts/maintenance/content-ops-checks/check-revision-escalation.js 2> escalation-stderr.txt
          EXIT_CODE=$?
          cat escalation-stderr.txt >&2
          if [ "$EXIT_CODE" -ne 0 ]; then
            reason=$(grep '❌ エラー:' escalation-stderr.txt | tail -n 1 | cut -c1-500)
            delim="EOF_$(openssl rand -hex 16)"
            {
              echo "error<<$delim"
              echo "${reason:-（エラーの行なし。終了コード $EXIT_CODE）}"
              echo "$delim"
            } >> "$GITHUB_OUTPUT"
          fi
          exit $EXIT_CODE

      # 以下の通知は always() を付ける。付けないと暗黙の success() で、上のステップが
      # 失敗した晩は滞留の通知ごとスキップされる（2026-09-11〜19 の 401 は9晩とも Slack に出なかった）
      - name: Notify Slack (閾値超過時のみ)
        if: always() && steps.checks.outputs.exit_code == '1'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SUMMARY: ${{ steps.checks.outputs.summary }}
        # payload は jq で組み立てる（ログの " ・改行・\ で JSON が壊れないように。BOA-644）。
        # section の text の上限3000文字を超えないよう、ログだけを切り詰める
        run: |
          payload=$(jq -n --arg summary "$SUMMARY" '
            ":warning: *コンテンツ運用の夜間チェックで滞留を検知*\n" as $head
            | "\n詳細: session-start-check.js または該当スクリプトを次回セッションで実行してください" as $tail
            | {
                attachments: [{
                  color: "#c9a227",
                  blocks: [{
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: ($head + "```" + ($summary | .[0:(2900 - ($head + $tail | length))]) + "```" + $tail)
                    }
                  }]
                }]
              }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"

      - name: Notify Slack (エスカレーションの失敗時)
        if: always() && steps.escalation.outcome == 'failure'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          ERROR: ${{ steps.escalation.outputs.error }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # 送るのはエラーの1行だけ（鍵・起票の本文は送らない）
        run: |
          payload=$(jq -n --arg error "$ERROR" --arg url "$RUN_URL" '
            {
              attachments: [{
                color: "#d32f2f",
                blocks: [{
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: (":x: *却下フィードバックの閾値エスカレーション（Linear 起票）が失敗*\n"
                      + "```" + ($error | .[0:2000]) + "```\n"
                      + "USAGE_LIMIT_EXCEEDED なら Linear の無料枠の上限。ログ: " + $url)
                  }
                }]
              }]
            }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
