name: Storage Mirror Restore Drill

# Storage の写し（ADR-0098）の復元の試験。R2 の写しを Supabase の試験用のバケット storage-mirror-drill（オーナーが作る、非公開）へ
# 戻し、読み直して sha256 と Content-Type を manifest と照合する。採用時に1回 all で全部、以後は月1回の見本
# （バケットごとに一番大きいファイルと20件）。戻す先は scripts/lib/storageMirrorDrill.js の定数1つで、写す元のバケットは拒む。消す処理は無い。
#
# 落ちたら job-watch（scripts/watch/job-watch.json の watched）が Issue にする。最後に成功した時刻は、この workflow の master の run の
# success（hq の dashboard-alerts が40日より前なら知らせる。hq 側の見張りは hq の作業で、この PR には無い）。ログにはバケット名・件数・容量だけを出す（repo は PUBLIC）。

on:
  schedule:
    # 毎月2日 05:20 JST = 1日 UTC 20:20（写しの 04:40 の後）
    - cron: "20 20 1 * *"
  workflow_dispatch:
    inputs:
      all:
        description: "元にある全部を戻す（採用時に1回）"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: storage-mirror-restore-drill
  cancel-in-progress: false

jobs:
  drill:
    if: github.repository == 'rhapsody0919/boatrace-ai-predictor'
    runs-on: ubuntu-latest
    # all（全部、約2,050件・406MB）は R2 から読む・上げる・読み直すの3往復。手元の写しの初回（読むだけ）が約10分だった
    timeout-minutes: 120
    environment: prod-jobs
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: 戻して照合する
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          INPUT_ALL: ${{ inputs.all }}
        run: |
          node --version
          args=""
          if [ "$INPUT_ALL" = "true" ]; then args="--all"; fi
          node scripts/storage-mirror/restore.js $args
