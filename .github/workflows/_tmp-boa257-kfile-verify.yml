name: "[TEMP] BOA-257 Kファイル実機検証"

on:
  workflow_dispatch:
  push:
    branches:
      - feature/boa-257-actual-course-kfile

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - name: フィクスチャに対するパーサー検証
        run: npm run verify:actual-course-kfile
      - name: 実際のKファイルをダウンロード・解凍(ネットワーク経由の実機検証)
        run: |
          node -e "
          import('./scripts/lib/kfileParser.js').then(async (mod) => {
            const text = await mod.fetchKFileText('2026-09-11');
            if (!text) { console.error('FAIL: text is null'); process.exit(1); }
            const rows = mod.parseKFileText(text, '2026-09-11');
            console.log('races parsed:', rows.length);
            if (rows.length !== 144) { console.error('FAIL: race count mismatch'); process.exit(1); }
            let totalBoats = 0, mismatches = 0;
            for (const r of rows) for (let b = 1; b <= 6; b++) {
              const c = r['actual_course_' + b];
              if (c == null) continue;
              totalBoats++;
              if (c !== b) mismatches++;
            }
            console.log('total_boats:', totalBoats, 'mismatches:', mismatches);
            if (totalBoats !== 863 || mismatches !== 88) {
              console.error('FAIL: boat/mismatch count drifted from known-good values');
              process.exit(1);
            }
            console.log('OK: GitHub Actions(ubuntu-latest, Node 22)でのLZH解凍・パースを実機確認');
          }).catch((e) => { console.error('FAIL:', e); process.exit(1); });
          "
