name: Aggregate Course Baseline Stats

# ST考察の「同コース・同級別の平均」と逃げシミュレーションを日次で事前集計する
# （phase a FR-1・FR-6、ADR-0068）。
#
# 実行基盤がVercelではなくGitHub Actionsなのは、ADR-0066が
# 「取得済みデータのDB内集計・統計更新（aggregate-stats・update-*-stats等）」を
# 明示的に対象外（GitHub Actionsのまま）としているため。本ジョブは外部サイトへの
# 通信を一切せず、自社DBの集計結果を同じDBに書くだけ（ADR-0068 却下4）。
#
# update-nige-outcome-distribution（JST 00:42）の直後に置く。前日の結果が
# 確定した後に走らせるため。集計は「利用可能な全期間」の移動窓なので、
# 起動が数時間ずれても対象範囲はほぼ変わらない（ADR-0068の影響）。
#
# continue-on-error は付けない（ジョブ全体を成功に見せない）。
# スクリプト側は「集計結果が0行」と「変更が無くて書き込みが0行」を区別し、
# 前者だけをエラーにする。
on:
  schedule:
    - cron: '50 15 * * *' # JST 00:50 (UTC 15:50)
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Run aggregation script
        run: node scripts/daily/update-course-baseline-stats.js
        env:
          TZ: 'Asia/Tokyo'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # tasks.md「完了の定義（バッチ分）」の継続監視。スクリプトは整合チェックに
      # 失敗すると非0で落ちるが、それだけでは赤いジョブが残るだけで誰も気づかない。
      # 既存の SLACK_WEBHOOK_URL（他の日次ジョブと同じ経路）へ流す。
      # 集計が止まれば window_end が古いまま残る＝この通知が「2日以上古い」の
      # 実質的な検知になる（行数が固定の表では scrape-monitor の daily_overdue が
      # 空振りするため、そちらは使えない）
      - name: Notify Slack (失敗時のみ)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # payload は jq で組み立てる（文字列への変数の直書きで JSON が壊れないように。BOA-644）
        run: |
          payload=$(jq -n --arg url "$RUN_URL" '{
            attachments: [{
              color: "#c9a227",
              blocks: [{
                type: "section",
                text: {
                  type: "mrkdwn",
                  text: (":warning: *コース×級別ベースラインの日次集計に失敗（phase a FR-1・FR-6）*\nst_course_baseline / nige_second_by_course が更新されていません。放置すると ST考察・逃げシミュレーションが古い window_end のまま表示され続けます。\n<" + $url + "|実行ログ>")
                }
              }]
            }]
          }')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
