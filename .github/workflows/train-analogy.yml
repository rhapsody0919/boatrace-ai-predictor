name: Train Analogy Finder

# BOA-271 アナロジー・ファインダーの主モデル（寄与度 FR-1）を学習し、寄与度プロファイルを
# analogy_models・analogy_contribution_profiles に書いて、表示に使う版を切り替える。
# docs/design/analogy-finder/plan.md「スクリプト構成と実行タイミング」。
#
# schedule は使わない（GitHub Actions の定時実行は遅れ・欠落が常態。設計 PR #1039 の近傍バッチの ADR と同じ判断）。
# 週次の起動は Vercel Cron（日曜 JST 4:00）からの workflow_dispatch（api/cron/analogy-dispatch.js、
# 別タスク T3-4）。それまでは手動で実行する。
# 品質ゲート（train.py）で止まったときは何も書かず、今の版の表示を続ける。

on:
  workflow_dispatch:
    inputs:
      model_version:
        description: "版の名前（省略時は JST の今日の日付）"
        required: false
        default: ""

concurrency:
  group: train-analogy
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ANALOGY_MODEL_VERSION: ${{ inputs.model_version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Python deps
        run: pip install -r scripts/ml/requirements.txt pytest

      - name: Test (as-of・リーク防止・ラウンド区分・集計)
        run: python -m pytest scripts/ml/analogy/tests -q

      - name: Export training data
        run: node scripts/ml/analogy/export_pool.js

      - name: Build features
        working-directory: scripts/ml/analogy
        run: python features.py

      # 品質ゲートの比較の相手は固定した参照版（scripts/ml/analogy/reference.json）。直前の版ではない
      - name: Download reference model (品質ゲートの比較用)
        run: node scripts/ml/analogy/storage.js download-reference

      - name: Train, quality gate, contribution profiles
        working-directory: scripts/ml/analogy
        run: python train.py

      - name: Upload model to Storage
        run: node scripts/ml/analogy/storage.js upload-model

      - name: Write profiles and activate
        working-directory: scripts/ml/analogy
        run: python db.py write

      # 寄与度の見え方が前の版から大きく変わったら知らせる（止めはしない。db.py の drift.json）
      - name: Notify Slack (寄与度のシェアが大きく動いたとき)
        if: success() && hashFiles('data/ml/analogy/out/drift.json') != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          drift=data/ml/analogy/out/drift.json
          if [ "$(jq -r .flagged "$drift")" != "true" ]; then exit 0; fi
          detail=$(jq -r '.changes[] | "finish_target=\(.finish_target) \(.theme) \(.max_abs_change * 1000 | round / 1000)"' "$drift" | paste -sd ' / ' -)
          payload=$(jq -n --arg d "$detail" --arg prev "$(jq -r .previous "$drift")" --arg url "$RUN_URL" \
            '{text: (":warning: *アナロジー・ファインダーの寄与度のシェアが前の版（" + $prev + "）から大きく動きました*（切り替えは済み）\n" + $d + "\n" + $url)}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"

      - name: Summary
        if: always()
        run: |
          meta=data/ml/analogy/out/train_meta.json
          failed=data/ml/analogy/out/gate_failed.json
          activated=data/ml/analogy/out/activated.json
          if [ -f "$failed" ]; then
            echo "## 品質ゲートで停止（表示は前の版のまま）" >> "$GITHUB_STEP_SUMMARY"
            jq '.gate' "$failed" >> "$GITHUB_STEP_SUMMARY"
          elif [ -f "$meta" ]; then
            if [ -f "$activated" ]; then
              echo "## 版 $(jq -r .model_version $meta) に切り替えた" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "## 版 $(jq -r .model_version $meta) は学習したが、切り替えていない" >> "$GITHUB_STEP_SUMMARY"
            fi
            jq '{periods: .metrics.periods, n_races: .metrics.n_races, gate: .metrics.gate, code_sha: .metrics.provenance.code_sha, win: (.metrics.win | {logloss_model, logloss_baseline, paired_logloss_model_minus_baseline})}' "$meta" >> "$GITHUB_STEP_SUMMARY"
            if [ -f data/ml/analogy/out/drift.json ]; then jq '{drift: .}' data/ml/analogy/out/drift.json >> "$GITHUB_STEP_SUMMARY"; fi
          fi

      - name: Notify Slack (失敗時のみ)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -f data/ml/analogy/out/gate_failed.json ]; then
            reason="品質ゲートで停止（表示は前の版のまま）: $(jq -r '.gate.reasons | join(" / ")' data/ml/analogy/out/gate_failed.json)"
          elif [ -f data/ml/analogy/out/activated.json ]; then
            reason="新しい版への切り替えの後（古い版の削除）で失敗。表示は新しい版"
          else
            reason="切り替えの前で失敗。表示は前の版のまま"
          fi
          payload=$(jq -n --arg reason "$reason" --arg url "$RUN_URL" \
            '{text: (":rotating_light: *アナロジー・ファインダーの週次学習が失敗しました*\n" + $reason + "\n" + $url)}')
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H "Content-Type: application/json" -d "$payload"
