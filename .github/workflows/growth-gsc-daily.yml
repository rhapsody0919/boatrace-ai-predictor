name: Growth GSC Daily

# Search Console の query × page × date を直近7日ぶん取り直し、Supabase の growth_gsc_daily へ upsert する
# （BOA-1706、hq 閉鎖 R2。前は非公開の hq が Mac の launchd で取っていた。docs/db-migration/204_growth_gsc_daily.sql）。
# 龍神は公開のリポジトリなので、数字をログ・artifact に出さない（スクリプトは日付と行数だけを出す）。
# 毎回7日を取り直すので、schedule が抜けた日は次の回で埋まる。失敗は job-watch.yml が拾う。
# 鍵は Environment prod-jobs（ADR-0097。GOOGLE_SERVICE_ACCOUNT_KEY・SEARCH_CONSOLE_SITE_URL・SUPABASE_* は既にある）。
on:
  schedule:
    # 予備。新設の日から GitHub の schedule が来なかった（11/23、key-canary の BOA-917 と同じ型）
    - cron: "23 1 * * *"
  # 主の起動: Vercel Cron から30分ごとに確実に起きる Key Canary の完了。JST 10時台の最初の1回だけ取る（下の if）
  workflow_run:
    workflows: [Key Canary]
    types: [completed]
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "過去分の取り直しの開始日（YYYY-MM-DD、2025-12-21 以降）。空なら毎日の取り込みだけ"
        required: false
        default: ""
      backfill_to:
        description: "過去分の取り直しの終了日（YYYY-MM-DD）。空なら PT の今日の3日前"
        required: false
        default: ""
      backfill_tables:
        description: "取り直す表（query・page のコンマ区切り）"
        required: false
        default: "page"
      dry_run:
        description: "取るだけで書かない（日付と行数だけ出す）"
        type: boolean
        default: true

concurrency:
  group: growth-gsc-daily
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # workflow_run（Key Canary の30分ごとの完了）で来たときは、JST 10:00〜10:29 の回だけ取る（1日1回）
  gate:
    if: github.repository == 'rhapsody0919/boatrace-ai-predictor'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      go: ${{ steps.t.outputs.go }}
    steps:
      - id: t
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hm=$(TZ=Asia/Tokyo date +%H%M)
          if [ "$EVENT" != "workflow_run" ] || { [ "$hm" -ge 1000 ] && [ "$hm" -lt 1030 ]; }; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "JST $hm は取り込みの時刻でないので何もしない"
          fi

  collect:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    # 過去分の取り直し（2025-12-21 から約340日、1日1〜数回の API）は20分に収まらないので、手で起こしたときだけ伸ばす。毎日の回は取り込み（数分）＋検査（上限15分）で35分
    timeout-minutes: ${{ github.event.inputs.backfill_from != '' && 120 || 35 }}
    environment: prod-jobs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - run: npm ci

      - name: Write service account key
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_KEY" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_KEY が無い（Environment prod-jobs の secret 未設定）"
            exit 1
          fi
          mkdir -p credentials
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_KEY" > credentials/google-service-account.json

      - name: Collect
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/google-service-account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/growth/collect-gsc-daily.js

      # ページ別（date × page、匿名の語も合計に入る。表 growth_gsc_page_daily、マイグレーション 205）も直近7日を取り直す。
      # GSC は2〜3日遅れなので、9日前から取る（backfill-gsc-daily.js の既定の終端は PT の今日の3日前）
      - name: Page daily (last 7 days)
        if: github.event.inputs.backfill_from == ''
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/google-service-account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/maintenance/backfill-gsc-daily.js --from "$(date -u -d '9 days ago' +%F)" --tables page

      # 索引の数を毎日測る（コアアップデートからの回復 打ち手 D。表 growth_url_inspection、マイグレーション 206）。
      # sitemap から、レース詳細は各会場の 1R・6R・12R の標本（D+1・D+3・D+7）、ほかの ja のページは週1回。最大400件を順に検査する。
      # 出力は URL と状態の名前と件数だけ。1件の検査の時間は未検証（目安 1〜2秒 → 400件で約7〜14分）なので、この手の上限は15分
      - name: URL Inspection (sitemap sample)
        if: github.event.inputs.backfill_from == ''
        timeout-minutes: 15
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/google-service-account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/maintenance/inspect-new-articles.js --sitemap public/sitemap.xml --max 400

      # 手で起こしたときの過去分の取り直し（入力は env 経由で渡し、式を run に直接埋めない）
      - name: Backfill (workflow_dispatch)
        if: github.event.inputs.backfill_from != ''
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY_PATH: ./credentials/google-service-account.json
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FROM: ${{ github.event.inputs.backfill_from }}
          TO: ${{ github.event.inputs.backfill_to }}
          TABLES: ${{ github.event.inputs.backfill_tables }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          args=(--from "$FROM" --tables "$TABLES")
          if [ -n "$TO" ]; then args+=(--to "$TO"); fi
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/maintenance/backfill-gsc-daily.js "${args[@]}"

      - name: Clean up credentials
        if: always()
        run: rm -f credentials/google-service-account.json
