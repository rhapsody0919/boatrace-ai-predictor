<!doctype html>
<html lang="ja">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- テーマのFOUC防止（ADR 0016）。data-theme属性をlocalStorageから初期表示前に同期する。
         キー名はsrc/config/theme.jsのTHEME_STORAGE_KEYと一致させること -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("ryujin-radar-theme");
          if (theme === "light" || theme === "dark") {
            document.documentElement.setAttribute("data-theme", theme);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Favicon & PWA -->
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f3ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0d1b2e" />

    <!-- SEO Meta Tags（description / canonical はアプリが言語別に出力するため静的定義しない） -->
    <meta name="keywords" content="ボートレース,AI分析,過去データ,データサイエンス,無料,データ分析,モーター性能,選手データ,龍神レーダー" />
    <meta name="author" content="龍神レーダー" />

    <!-- OGP Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="龍神レーダー" />
    <meta property="og:title" content="龍神レーダー - 無料のボートレースAI予想＆データ分析" />
    <meta property="og:description" content="選手成績・モーター・展示・スタートのデータを、過去の実際のレース結果で数えて見える化するボートレースのデータ分析サービス。全24場に対応し、完全無料・登録不要で使えます。" />
    <!-- og:url は静的に置かない（BOA-691）。JS を実行しない Facebook 等は og:url が指す URL を
         辿ってその情報を使うため、トップ固定だとレース詳細・記事の共有がすべてトップ扱いになる。
         無ければ共有された URL そのものが使われる。記事など URL を持つページは useSocialMeta が付ける -->
    <meta property="og:image" content="https://www.boat-ai.jp/ogp-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="龍神レーダー - 無料のボートレースAI予想＆データ分析" />
    <meta name="twitter:description" content="選手成績・モーター・展示・スタートのデータを、過去の実際のレース結果で数えて見える化するボートレースのデータ分析サービス。完全無料・登録不要。" />
    <meta name="twitter:image" content="https://www.boat-ai.jp/ogp-image.png" />

    <!-- Robots -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <title>龍神レーダー - 無料のボートレースAI予想＆データ分析</title>

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {

      "name": "龍神レーダー",

    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "龍神レーダー",
      "applicationCategory": "SportsApplication",

        "@type": "Offer",
        "price": "0",
        "priceCurrency": "JPY"
      },

    <script type="application/ld+json">

    <!-- Google Analytics (GA4) -->
    <!-- GA設定はmain.jsxで動的に行われます -->
</head>

<body>

    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
